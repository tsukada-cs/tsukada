<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<!-- Washi texture, layer 1: pulp mottling + paper grain (seamless tile). Generated; tweak alpha values to change strength. -->
<defs>
<filter id="m" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.0085" numOctaves="3" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.34  0 0 0 0 0.22  0.200 0 0 0 -0.080"/></filter>
<filter id="g" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="10" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.18  0.200 0 0 0 -0.080"/></filter>
</defs>
<rect width="100%" height="100%" filter="url(#m)"/>
<rect width="100%" height="100%" filter="url(#g)"/>
</svg>
